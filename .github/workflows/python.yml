name: Python

on:
  workflow_call:

jobs:
  python:
    name: "python${{ matrix.version }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ${{ github.event_name == 'pull_request' && 'Build and test image' || 'Build, test and push image' }}
        uses: ./.github/actions/build-image
        with:
          tag: python${{ matrix.version }}
          base: base_debian
          context: ./python
          build-args: PYTHON_VERSION=${{ matrix.version }}
          test: pip --version
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc-connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

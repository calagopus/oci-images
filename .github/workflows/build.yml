name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 1,15 * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - base/**
      - bun/**
      - go/**
      - installers/**
      - java/**
      - nodejs/**
      - python/**
      - rust/**
      - steamcmd/**
      - wine/**
  pull_request:
    paths:
      - .github/workflows/build.yml
      - base/**
      - bun/**
      - go/**
      - installers/**
      - java/**
      - nodejs/**
      - python/**
      - rust/**
      - steamcmd/**
      - wine/**

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/calagopus/oci-images
  PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64

jobs:
  base:
    name: "base_${{ matrix.base }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base:
          - alpine
          - debian
          - ubuntu
    env:
      TAG: base_${{ matrix.base }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./base
          file: ./base/${{ matrix.base }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Test image
        run: docker run --rm -e STARTUP="id" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./base
          file: ./base/${{ matrix.base }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

  installers:
    name: "installers_${{ matrix.installer }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer:
          - alpine
          - debian
          - ubuntu
    env:
      TAG: installers_${{ matrix.installer }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./installers
          file: ./installers/${{ matrix.installer }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_${{ matrix.installer }}

      - name: Test image
        run: docker run --rm "$IMAGE:$TAG" sh -c 'test "$(id -u)" = 0 && jq --version'

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./installers
          file: ./installers/${{ matrix.installer }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_${{ matrix.installer }}

  bun:
    name: "bun${{ matrix.version }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1"
    env:
      TAG: bun${{ matrix.version }}
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./bun
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            BUN_VERSION=${{ matrix.version }}

      - name: Test image
        run: docker run --rm -e STARTUP="bun --version" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./bun
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            BUN_VERSION=${{ matrix.version }}

  go:
    name: "go${{ matrix.version }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.24"
          - "1.25"
          - "1.26"
          - "1.27"
    env:
      TAG: go${{ matrix.version }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./go
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            GO_VERSION=${{ matrix.version }}

      - name: Test image
        run: docker run --rm -e STARTUP="go version" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./go
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            GO_VERSION=${{ matrix.version }}

  java:
    name: "java${{ matrix.version }}_${{ matrix.vendor }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - corretto
          - graalvm-ce
          - graalvm-ee
          - shenandoah
          - temurin
          - zulu
        version:
          - 8
          - 11
          - 17
          - 21
          - 25
          - 26
          - 27
        exclude:
          - vendor: graalvm-ce
            version: 8
          - vendor: graalvm-ce
            version: 11
          - vendor: graalvm-ce
            version: 26
          - vendor: graalvm-ce
            version: 27
          - vendor: graalvm-ee
            version: 8
          - vendor: graalvm-ee
            version: 11
          - vendor: graalvm-ee
            version: 17
          - vendor: graalvm-ee
            version: 26
          - vendor: graalvm-ee
            version: 27
          - vendor: zulu
            version: 27
    env:
      TAG: java${{ matrix.version }}_${{ matrix.vendor }}
      PLATFORMS: >-
        ${{ matrix.vendor == 'shenandoah' && matrix.version >= 17
        && 'linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64'
        || matrix.vendor == 'temurin' && 'linux/amd64,linux/arm64,linux/ppc64le'
        || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./java
          file: ./java/${{ matrix.vendor }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            JAVA_VERSION=${{ matrix.version }}
            GRAALVM_TAG=${{ matrix.version < 25 && matrix.version || format('{0}i-ol10', matrix.version) }}

      - name: Test image
        run: docker run --rm -e STARTUP="java -version" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./java
          file: ./java/${{ matrix.vendor }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            JAVA_VERSION=${{ matrix.version }}
            GRAALVM_TAG=${{ matrix.version < 25 && matrix.version || format('{0}i-ol10', matrix.version) }}

  nodejs:
    name: "nodejs${{ matrix.version }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 18
          - 19
          - 20
          - 21
          - 22
          - 23
          - 24
          - 25
          - 26
    env:
      TAG: nodejs${{ matrix.version }}
      PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./nodejs
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            NODE_VERSION=${{ matrix.version }}

      - name: Test image
        run: docker run --rm -e STARTUP="npm --version" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./nodejs
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            NODE_VERSION=${{ matrix.version }}

  python:
    name: "python${{ matrix.version }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    env:
      TAG: python${{ matrix.version }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./python
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            PYTHON_VERSION=${{ matrix.version }}

      - name: Test image
        run: docker run --rm -e STARTUP="pip --version" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./python
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            PYTHON_VERSION=${{ matrix.version }}

  rust:
    name: "rust${{ matrix.version }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1"
    env:
      TAG: rust${{ matrix.version }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./rust
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            RUST_VERSION=${{ matrix.version }}

      - name: Test image
        run: docker run --rm -e STARTUP="cargo --version" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./rust
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_debian
            RUST_VERSION=${{ matrix.version }}

  steamcmd:
    name: "steamcmd_${{ matrix.steamcmd }}"
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        steamcmd:
          - debian
          - ubuntu
    env:
      TAG: steamcmd_${{ matrix.steamcmd }}
      PLATFORMS: linux/amd64
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./steamcmd
          file: ./steamcmd/${{ matrix.steamcmd }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_${{ matrix.steamcmd }}

      - name: Test image
        run: docker run --rm -e AUTO_UPDATE=0 -e STARTUP="test -e /lib/ld-linux.so.2" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./steamcmd
          file: ./steamcmd/${{ matrix.steamcmd }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base_${{ matrix.steamcmd }}

  steamcmd-runtimes:
    name: "steamcmd_${{ matrix.steamcmd }}"
    needs: steamcmd
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - steamcmd: dotnet
            base: steamcmd_debian
            test: dotnet --list-runtimes
          - steamcmd: proton
            base: steamcmd_debian
            test: proton run cmd.exe /c exit 0
          - steamcmd: sniper
            base: base_debian
            test: test -e /lib/ld-linux.so.2
    env:
      TAG: steamcmd_${{ matrix.steamcmd }}
      PLATFORMS: linux/amd64
      TEST: ${{ matrix.test }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./steamcmd
          file: ./steamcmd/${{ matrix.steamcmd }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:${{ matrix.base }}

      - name: Test image
        run: docker run --rm -e AUTO_UPDATE=0 -e STARTUP="$TEST" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./steamcmd
          file: ./steamcmd/${{ matrix.steamcmd }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:${{ matrix.base }}

  wine:
    name: "wine_${{ matrix.branch }}"
    needs: steamcmd
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - stable
          - staging
          - devel
    env:
      TAG: wine_${{ matrix.branch }}
      PLATFORMS: linux/amd64
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ./wine
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:steamcmd_debian
            WINE_BRANCH=${{ matrix.branch }}

      - name: Test image
        run: docker run --rm -e AUTO_UPDATE=0 -e WINETRICKS_RUN=mono -e STARTUP="test -d .wine/drive_c/windows/mono" "$IMAGE:$TAG"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./wine
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:steamcmd_debian
            WINE_BRANCH=${{ matrix.branch }}

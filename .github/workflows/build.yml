name: Build Images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 1"
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/**
      - base/**
      - bun/**
      - deno/**
      - dotnet/**
      - go/**
      - installers/**
      - java/**
      - nodejs/**
      - php/**
      - python/**
      - rust/**
      - steamcmd/**
      - wine/**
      - "!**/*.md"
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/**
      - base/**
      - bun/**
      - deno/**
      - dotnet/**
      - go/**
      - installers/**
      - java/**
      - nodejs/**
      - php/**
      - python/**
      - rust/**
      - steamcmd/**
      - wine/**
      - "!**/*.md"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base: ${{ steps.changes.outputs.base }}
      installers: ${{ steps.changes.outputs.installers }}
      bun: ${{ steps.changes.outputs.bun }}
      deno: ${{ steps.changes.outputs.deno }}
      dotnet: ${{ steps.changes.outputs.dotnet }}
      go: ${{ steps.changes.outputs.go }}
      java: ${{ steps.changes.outputs.java }}
      nodejs: ${{ steps.changes.outputs.nodejs }}
      php: ${{ steps.changes.outputs.php }}
      python: ${{ steps.changes.outputs.python }}
      rust: ${{ steps.changes.outputs.rust }}
      steamcmd: ${{ steps.changes.outputs.steamcmd }}
      wine: ${{ steps.changes.outputs.wine }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          all=true
          if [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=false
            changed=$(git diff --name-only "$BEFORE" HEAD -- . ':!*.md')
          elif [ "$EVENT" = "pull_request" ]; then
            all=false
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- . ':!*.md')
          fi
          for image in base installers bun deno dotnet go java nodejs php python rust steamcmd wine; do
            if [ "$all" = "true" ] || grep -q -e "^${image}/" -e "^\.github/actions/" -e "^\.github/workflows/" <<< "$changed"; then
              echo "${image}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${image}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  base:
    name: Base
    needs: changes
    if: needs.changes.outputs.base == 'true'
    uses: ./.github/workflows/base.yml
    secrets: inherit

  installers:
    name: Installers
    needs:
      - changes
      - base
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.installers == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/installers.yml
    secrets: inherit

  bun:
    name: Bun
    needs:
      - changes
      - base
      - installers
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.bun == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/bun.yml
    secrets: inherit

  deno:
    name: Deno
    needs:
      - changes
      - base
      - bun
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.deno == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/deno.yml
    secrets: inherit

  dotnet:
    name: .NET
    needs:
      - changes
      - base
      - deno
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/dotnet.yml
    secrets: inherit

  go:
    name: Go
    needs:
      - changes
      - base
      - dotnet
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/go.yml
    secrets: inherit

  java:
    name: Java
    needs:
      - changes
      - base
      - go
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.java == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/java.yml
    secrets: inherit

  nodejs:
    name: Node.js
    needs:
      - changes
      - base
      - java
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/nodejs.yml
    secrets: inherit

  php:
    name: PHP
    needs:
      - changes
      - base
      - nodejs
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.php == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/php.yml
    secrets: inherit

  python:
    name: Python
    needs:
      - changes
      - base
      - php
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/python.yml
    secrets: inherit

  rust:
    name: Rust
    needs:
      - changes
      - base
      - python
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/rust.yml
    secrets: inherit

  steamcmd:
    name: SteamCMD
    needs:
      - changes
      - base
      - rust
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.steamcmd == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/steamcmd.yml
    secrets: inherit

  steamcmd-runtimes:
    name: SteamCMD Runtimes
    needs:
      - changes
      - base
      - steamcmd
    if: ${{ !cancelled() && needs.base.result != 'failure' && needs.steamcmd.result != 'failure' && (needs.changes.outputs.steamcmd == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/steamcmd-runtimes.yml
    secrets: inherit

  wine:
    name: Wine
    needs:
      - changes
      - base
      - steamcmd
      - steamcmd-runtimes
    if: ${{ !cancelled() && needs.base.result != 'failure' && needs.steamcmd.result != 'failure' && (needs.changes.outputs.wine == 'true' || needs.changes.outputs.steamcmd == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/wine.yml
    secrets: inherit

name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 1"
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - base/**
      - bun/**
      - go/**
      - installers/**
      - java/**
      - nodejs/**
      - python/**
      - rust/**
      - steamcmd/**
      - wine/**
      - "!**/*.md"
  pull_request:
    paths:
      - .github/workflows/**
      - base/**
      - bun/**
      - go/**
      - installers/**
      - java/**
      - nodejs/**
      - python/**
      - rust/**
      - steamcmd/**
      - wine/**
      - "!**/*.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.changes.outputs.base }}
      installers: ${{ steps.changes.outputs.installers }}
      bun: ${{ steps.changes.outputs.bun }}
      go: ${{ steps.changes.outputs.go }}
      java: ${{ steps.changes.outputs.java }}
      nodejs: ${{ steps.changes.outputs.nodejs }}
      python: ${{ steps.changes.outputs.python }}
      rust: ${{ steps.changes.outputs.rust }}
      steamcmd: ${{ steps.changes.outputs.steamcmd }}
      wine: ${{ steps.changes.outputs.wine }}
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the images to build
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          all=true
          if [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=false
            changed=$(git diff --name-only "$BEFORE" HEAD -- . ':!*.md')
          elif [ "$EVENT" = "pull_request" ]; then
            all=false
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- . ':!*.md')
          fi
          for image in base installers bun go java nodejs python rust steamcmd wine; do
            if [ "$all" = "true" ] || grep -q -e "^${image}/" -e "^\.github/workflows/" <<< "$changed"; then
              echo "${image}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${image}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  base:
    name: base
    needs: changes
    if: needs.changes.outputs.base == 'true'
    uses: ./.github/workflows/base.yml

  installers:
    name: installers
    needs:
      - changes
      - base
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.installers == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/installers.yml

  bun:
    name: bun
    needs:
      - changes
      - base
      - installers
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.bun == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/bun.yml

  go:
    name: go
    needs:
      - changes
      - base
      - bun
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/go.yml

  java:
    name: java
    needs:
      - changes
      - base
      - go
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.java == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/java.yml

  nodejs:
    name: nodejs
    needs:
      - changes
      - base
      - java
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.nodejs == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/nodejs.yml

  python:
    name: python
    needs:
      - changes
      - base
      - nodejs
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/python.yml

  rust:
    name: rust
    needs:
      - changes
      - base
      - python
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/rust.yml

  steamcmd:
    name: steamcmd
    needs:
      - changes
      - base
      - rust
    if: ${{ !cancelled() && needs.base.result != 'failure' && (needs.changes.outputs.steamcmd == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/steamcmd.yml

  steamcmd-runtimes:
    name: steamcmd-runtimes
    needs:
      - changes
      - base
      - steamcmd
    if: ${{ !cancelled() && needs.base.result != 'failure' && needs.steamcmd.result != 'failure' && (needs.changes.outputs.steamcmd == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/steamcmd-runtimes.yml

  wine:
    name: wine
    needs:
      - changes
      - base
      - steamcmd
      - steamcmd-runtimes
    if: ${{ !cancelled() && needs.base.result != 'failure' && needs.steamcmd.result != 'failure' && (needs.changes.outputs.wine == 'true' || needs.changes.outputs.steamcmd == 'true' || needs.changes.outputs.base == 'true') }}
    uses: ./.github/workflows/wine.yml

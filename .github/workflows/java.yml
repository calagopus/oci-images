name: Java

on:
  workflow_call:

jobs:
  java:
    name: "java${{ matrix.version }}_${{ matrix.vendor }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        vendor:
          - corretto
          - graalvm-ce
          - graalvm-ee
          - semeru
          - shenandoah
          - temurin
          - zulu
        version:
          - 8
          - 11
          - 17
          - 21
          - 25
          - 26
          - 27
        exclude:
          - vendor: graalvm-ce
            version: 8
          - vendor: graalvm-ce
            version: 11
          - vendor: graalvm-ce
            version: 26
          - vendor: graalvm-ce
            version: 27
          - vendor: graalvm-ee
            version: 8
          - vendor: graalvm-ee
            version: 11
          - vendor: graalvm-ee
            version: 17
          - vendor: graalvm-ee
            version: 26
          - vendor: graalvm-ee
            version: 27
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ${{ github.event_name == 'pull_request' && 'Build and test image' || 'Build, test and push image' }}
        uses: ./.github/actions/build-image
        with:
          tag: java${{ matrix.version }}_${{ matrix.vendor }}
          base: base_debian
          context: ./java
          file: ./java/${{ matrix.vendor }}/Dockerfile
          build-args: |
            JAVA_VERSION=${{ matrix.version }}
            GRAALVM_TAG=${{ matrix.version < 25 && matrix.version || format('{0}i-ol10', matrix.version) }}
          platforms: >-
            ${{ matrix.vendor == 'shenandoah' && matrix.version >= 17
            && 'linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64'
            || (matrix.vendor == 'semeru' || matrix.vendor == 'temurin') && 'linux/amd64,linux/arm64,linux/ppc64le'
            || 'linux/amd64,linux/arm64' }}
          test: java -version
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc-connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

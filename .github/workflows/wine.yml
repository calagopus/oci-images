name: Wine

on:
  workflow_call:

jobs:
  wine:
    name: "wine_${{ matrix.branch }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        branch:
          - stable
          - staging
          - devel
          - "8"
          - "9"
          - "10"
          - "11"
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ${{ github.event_name == 'pull_request' && 'Build and test image' || 'Build, test and push image' }}
        uses: ./.github/actions/build-image
        with:
          tag: wine_${{ matrix.branch }}
          base: steamcmd_debian
          context: ./wine
          build-args: WINE_BRANCH=${{ matrix.branch }}
          platforms: linux/amd64
          test-env: WINETRICKS_RUN=mono
          test: test -d .wine/drive_c/windows/mono
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc-connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

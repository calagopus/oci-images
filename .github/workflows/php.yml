name: php

on:
  workflow_call:

jobs:
  php:
    name: "php${{ matrix.version }}"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    uses: ./.github/workflows/image.yml
    secrets: inherit
    with:
      tag: php${{ matrix.version }}
      base: base_debian
      context: ./php
      build-args: PHP_VERSION=${{ matrix.version }}
      platforms: >-
        ${{ matrix.version == '8.3'
        && 'linux/amd64,linux/arm64,linux/ppc64le'
        || 'linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64' }}
      test: |
        for extension in bcmath exif gd gmp intl mysqli pcntl pdo_mysql pdo_pgsql redis sockets zip "Zend OPcache"; do
          php -m | grep -qx "$extension" || { echo "missing $extension"; exit 1; }
        done
        composer --version

name: go

on:
  workflow_call:

jobs:
  go:
    name: "go${{ matrix.version }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version:
          - "1.24"
          - "1.25"
          - "1.26"
          - "1.27"
    uses: ./.github/workflows/image.yml
    with:
      tag: go${{ matrix.version }}
      base: base_debian
      context: ./go
      build-args: GO_VERSION=${{ matrix.version }}
      test: go version

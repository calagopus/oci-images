name: SteamCMD Runtimes

on:
  workflow_call:

jobs:
  steamcmd-runtimes:
    name: "steamcmd_${{ matrix.steamcmd }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - steamcmd: dotnet
            base: steamcmd_debian
            test: dotnet --list-runtimes
          - steamcmd: proton
            base: steamcmd_debian
            test: proton run cmd.exe /c exit 0
          - steamcmd: sniper
            base: base_debian
            test: test -e /lib/ld-linux.so.2
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ${{ github.event_name == 'pull_request' && 'Build and test image' || 'Build, test and push image' }}
        uses: ./.github/actions/build-image
        with:
          tag: steamcmd_${{ matrix.steamcmd }}
          base: ${{ matrix.base }}
          context: ./steamcmd
          file: ./steamcmd/${{ matrix.steamcmd }}/Dockerfile
          platforms: linux/amd64
          test: ${{ matrix.test }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc-connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

name: .NET

on:
  workflow_call:

jobs:
  dotnet:
    name: "dotnet${{ matrix.version }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version:
          - "7"
          - "8"
          - "9"
          - "10"
          - "11"
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ${{ github.event_name == 'pull_request' && 'Build and test image' || 'Build, test and push image' }}
        uses: ./.github/actions/build-image
        with:
          tag: dotnet${{ matrix.version }}
          base: base_debian
          context: ./dotnet
          build-args: DOTNET_VERSION=${{ matrix.version }}
          platforms: linux/amd64,linux/arm64
          test: dotnet new console -o /tmp/app && dotnet run --project /tmp/app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc-connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
